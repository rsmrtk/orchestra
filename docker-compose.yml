version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: orchestra-db
    restart: unless-stopped
    environment:
      # ВАЖЛИВО: Встановіть ці змінні у .env файлі!
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-orchestra-db}
    ports:
      - "${DB_PORT:-2828}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - orchestra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-orchestra-db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orchestra-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # ВАЖЛИВО: Встановіть ці змінні у .env файлі!
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-orchestra-db}
      PORT: ${BACKEND_PORT:-8282}
      # ВАЖЛИВО: Згенеруйте власний JWT_SECRET!
      JWT_SECRET: ${JWT_SECRET}
      JWT_DURATION: ${JWT_DURATION:-24h}
      GIN_MODE: ${GIN_MODE:-debug}
    ports:
      - "${BACKEND_PORT:-8282}:8282"
    networks:
      - orchestra-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8282/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8282}
    container_name: orchestra-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8282}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - orchestra-network

networks:
  orchestra-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
