# =============================================================================
# NGINX REVERSE PROXY - Об'єднує Frontend + Backend на одному порті
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: orchestra-space
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream frontend {
            server orchestra-frontend-service-production:80;
        }

        upstream backend {
            server orchestra-backend-service-production:80;
        }

        server {
            listen 8080;

            # Frontend - всі запити крім /api/
            location / {
                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # Backend API - всі запити на /api/
            location /api/ {
                rewrite ^/api/(.*) /$1 break;
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: orchestra-space
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-proxy-config

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy-service
  namespace: orchestra-space
spec:
  type: NodePort
  selector:
    app: nginx-proxy
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30090
