# ==========================================
# Автоматичний Release
# Запускається при створенні тега v*.*.*
# ==========================================
name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0, v2.1.3, etc.

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==========================================
  # 📦 Build & Release
  # ==========================================
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Для changelog

      # ==========================================
      # Backend Build
      # ==========================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Build backend binaries
        run: |
          cd backend
          VERSION=${GITHUB_REF#refs/tags/}

          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=$VERSION" \
            -o ../release/orchestra-backend-linux-amd64 \
            ./cmd/server/main.go

          # macOS
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=$VERSION" \
            -o ../release/orchestra-backend-darwin-amd64 \
            ./cmd/server/main.go

          # macOS ARM
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -ldflags="-w -s -X main.Version=$VERSION" \
            -o ../release/orchestra-backend-darwin-arm64 \
            ./cmd/server/main.go

          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=$VERSION" \
            -o ../release/orchestra-backend-windows-amd64.exe \
            ./cmd/server/main.go

      # ==========================================
      # Frontend Build
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd dist
          tar -czf ../../release/orchestra-frontend-dist.tar.gz .

      # ==========================================
      # Docker Images
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/deployments/staging/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest

      # ==========================================
      # GitHub Release
      # ==========================================
      - name: Generate changelog
        id: changelog
        run: |
          # Отримуємо попередній тег
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # Перший релиз
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            # Зміни з попереднього тега
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          # Зберігаємо в файл
          echo "$CHANGELOG" > changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.txt
          files: |
            release/orchestra-backend-*
            release/orchestra-frontend-dist.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

      # ==========================================
      # Notification
      # ==========================================
      - name: Release summary
        run: |
          echo "## 🎉 Release ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Backend binaries (Linux, macOS, Windows)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend dist archive" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🐳 Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
