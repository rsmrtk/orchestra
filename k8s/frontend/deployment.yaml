# ============================================
# Frontend Deployment для Orchestra
# ============================================
#
# ЩО ЦЕЙ ФАЙЛ РОБИТЬ:
# - Створює 2 копії frontend Pod'ів
# - Кожен Pod запускає Nginx з React SPA
# - Nginx сервує статичні файли
#
# ============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: orchestra-frontend
  namespace: default

  labels:
    app: orchestra
    component: frontend
    version: v1

spec:
  # Frontend можна масштабувати горизонтально
  # (статичні файли не мають стану)
  replicas: 2

  selector:
    matchLabels:
      app: orchestra
      component: frontend

  template:
    metadata:
      labels:
        app: orchestra
        component: frontend
        version: v1

    spec:
      containers:
      - name: frontend
        image: orchestra-frontend:v1
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 5173
          protocol: TCP

        # Frontend зазвичай потребує менше ресурсів
        # (просто Nginx сервує статику)
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

        # Liveness probe - чи Nginx працює
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe - чи готовий сервувати
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Environment для frontend
        # (якщо потрібно налаштувати API URL через env)
        # env:
        # - name: REACT_APP_API_URL
        #   value: "http://orchestra-backend"

      restartPolicy: Always

# ============================================
# ПРИМІТКИ ДЛЯ FRONTEND
# ============================================
#
# Frontend (React SPA) особливості:
#
# 1. STATELESS:
#    - Немає стану між запитами
#    - Можна легко масштабувати
#    - Не потрібен persistent storage
#
# 2. API URL:
#    - Зазвичай hardcoded в build
#    - Для різних environments можна:
#      a) Різні Docker images
#      b) Runtime config через window.env
#      c) ConfigMap з nginx config
#
# 3. NGINX конфігурація:
#    - try_files для React Router
#    - Кешування статичних assets
#    - Compression (gzip)
#
# ============================================
