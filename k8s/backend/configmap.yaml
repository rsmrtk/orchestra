# ============================================
# Backend ConfigMap для Orchestra
# ============================================
#
# ЩО ЦЕЙ ФАЙЛ РОБИТЬ:
# - Зберігає конфігурацію (НЕ секретні дані!)
# - Дозволяє змінювати налаштування без rebuild образу
# - Можна використати як environment змінні або файли
#
# ЩО ЗБЕРІГАТИ В ConfigMap:
# ✓ Налаштування додатку (port, log level, etc.)
# ✓ Конфігураційні файли
# ✓ Feature flags
# ✗ НЕ паролі/токени (для цього використовуй Secret!)
#
# ============================================

apiVersion: v1
kind: ConfigMap

# ----------------------------------------
# METADATA
# ----------------------------------------
metadata:
  name: backend-config
  namespace: default

  labels:
    app: orchestra
    component: backend
    config-type: application

# ----------------------------------------
# DATA - Конфігурація
# ----------------------------------------
data:
  # ========================================
  # Прості ключ-значення (як env змінні)
  # ========================================

  # Порт сервера
  PORT: "8383"

  # Рівень логування (debug, info, warn, error)
  LOG_LEVEL: "info"

  # Gin mode (debug або release)
  GIN_MODE: "release"

  # CORS налаштування
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://orchestra-frontend"

  # Timeout
  REQUEST_TIMEOUT: "30s"

  # Max connections
  MAX_CONNECTIONS: "100"

  # ========================================
  # Конфігураційний файл (багаторядковий)
  # ========================================

  # Файл app.conf
  app.conf: |
    # Orchestra Backend Configuration
    [server]
    port = 8383
    host = 0.0.0.0
    read_timeout = 30s
    write_timeout = 30s

    [logging]
    level = info
    format = json
    output = stdout

    [cors]
    enabled = true
    allowed_origins = *
    allowed_methods = GET,POST,PUT,DELETE
    allowed_headers = Content-Type,Authorization

    [health]
    enabled = true
    endpoint = /health

  # JSON конфігурація
  features.json: |
    {
      "congratulation_endpoint": true,
      "metrics_enabled": false,
      "tracing_enabled": false,
      "rate_limiting": {
        "enabled": false,
        "requests_per_minute": 100
      }
    }

  # YAML конфігурація
  settings.yaml: |
    server:
      port: 8383
      timeout: 30s
    logging:
      level: info
      format: json
    features:
      metrics: false
      tracing: false

# ============================================
# ЯК ВИКОРИСТАТИ ConfigMap
# ============================================

---
# ----------------------------------------
# Приклад 1: Як environment змінні
# ----------------------------------------
# У deployment.yaml:
#
# env:
# # Одна змінна
# - name: PORT
#   valueFrom:
#     configMapKeyRef:
#       name: backend-config
#       key: PORT
#
# # Всі змінні з ConfigMap
# envFrom:
# - configMapRef:
#     name: backend-config

---
# ----------------------------------------
# Приклад 2: Як файли (Volume Mount)
# ----------------------------------------
# У deployment.yaml:
#
# volumeMounts:
# - name: config
#   mountPath: /etc/config        # Шлях в контейнері
#   readOnly: true
#
# volumes:
# - name: config
#   configMap:
#     name: backend-config
#     items:
#     - key: app.conf             # Ключ з ConfigMap
#       path: app.conf            # Назва файлу
#     - key: features.json
#       path: features.json
#
# Результат:
# /etc/config/app.conf
# /etc/config/features.json

---
# ----------------------------------------
# Приклад 3: Конкретний файл
# ----------------------------------------
# volumeMounts:
# - name: app-config
#   mountPath: /app/config.yaml
#   subPath: settings.yaml        # Тільки один файл
#
# volumes:
# - name: app-config
#   configMap:
#     name: backend-config

# ============================================
# IMMUTABLE ConfigMap (К8s 1.19+)
# ============================================
#
# Для production - зроби ConfigMap immutable:
# immutable: true
#
# Переваги:
# - Захист від випадкових змін
# - Краща performance (K8s не watch'ить зміни)
#
# Недолік:
# - Щоб змінити - треба видалити і створити заново
#
# ============================================

---
# Приклад Immutable ConfigMap:
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config-immutable
  namespace: default
immutable: true  # Не можна змінити!
data:
  PORT: "8383"
  LOG_LEVEL: "info"

# ============================================
# ConfigMap з binary data
# ============================================

---
# Для binary файлів використовуй binaryData:
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-binary-config
binaryData:
  # Base64 encoded binary data
  logo.png: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==

# ============================================
# КОМАНДИ
# ============================================
#
# 1. Створити ConfigMap:
#    kubectl apply -f configmap.yaml
#
# 2. Переглянути ConfigMap:
#    kubectl get configmap backend-config
#    kubectl get cm backend-config  # скорочення
#    kubectl describe cm backend-config
#
# 3. Переглянути data:
#    kubectl get cm backend-config -o yaml
#    kubectl get cm backend-config -o json | jq .data
#
# 4. Створити ConfigMap з файлу:
#    kubectl create configmap backend-config \
#      --from-file=app.conf \
#      --from-file=features.json
#
# 5. Створити з literal values:
#    kubectl create configmap backend-config \
#      --from-literal=PORT=8383 \
#      --from-literal=LOG_LEVEL=info
#
# 6. Оновити ConfigMap:
#    kubectl apply -f configmap.yaml
#    # УВАГА: Pod'и не перезапустяться автоматично!
#    # Треба перезапустити вручну або використати rolling restart:
#    kubectl rollout restart deployment orchestra-backend
#
# 7. Видалити:
#    kubectl delete -f configmap.yaml
#
# ============================================

# ============================================
# BEST PRACTICES
# ============================================
#
# 1. ✓ Використовуй осмислені назви ключів:
#    PORT, LOG_LEVEL (добре)
#    p, ll (погано)
#
# 2. ✓ Групуй пов'язані налаштування:
#    backend-config, backend-features (добре)
#    config1, config2 (погано)
#
# 3. ✓ Версіонуй ConfigMaps для rollback:
#    backend-config-v1, backend-config-v2
#
# 4. ✓ Документуй значення:
#    # comments в YAML
#
# 5. ✗ НЕ зберігай секрети:
#    Паролі → Secret, не ConfigMap!
#
# 6. ✓ Для production - immutable:
#    immutable: true
#
# 7. ✓ Використовуй namespace:
#    Розділяй dev/staging/prod
#
# ============================================

# ============================================
# TROUBLESHOOTING
# ============================================
#
# Pod не бачить ConfigMap?
#
# 1. Перевір чи існує ConfigMap:
#    kubectl get cm backend-config
#
# 2. Перевір namespace:
#    kubectl get cm backend-config -n <namespace>
#
# 3. Перевір чи Pod може читати:
#    kubectl describe pod <pod-name>
#    (шукай Events з помилками)
#
# 4. Перевір env змінні в Pod:
#    kubectl exec <pod-name> -- env | grep PORT
#
# 5. Перевір змонтовані файли:
#    kubectl exec <pod-name> -- ls -la /etc/config
#    kubectl exec <pod-name> -- cat /etc/config/app.conf
#
# 6. ConfigMap змінився але Pod не оновився:
#    kubectl rollout restart deployment orchestra-backend
#
# ============================================

# ============================================
# АЛЬТЕРНАТИВИ
# ============================================
#
# Замість ConfigMap можна використати:
#
# 1. Environment змінні в Deployment (для простих значень)
# 2. Secret (для чутливих даних)
# 3. External config systems (Consul, etcd)
# 4. Config files in Docker image (не рекомендується)
#
# ============================================
