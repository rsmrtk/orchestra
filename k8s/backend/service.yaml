# ============================================
# Backend Service для Orchestra
# ============================================
#
# ЩО ЦЕЙ ФАЙЛ РОБИТЬ:
# - Створює постійний IP адрес для backend
# - Балансує трафік між всіма backend Pod'ами
# - Дає DNS ім'я: orchestra-backend.default.svc.cluster.local
#
# ТИПИ SERVICE:
# - ClusterIP: Доступ ТІЛЬКИ всередині кластера (за замовчуванням)
# - NodePort: Доступ ззовні через IP ноди + порт 30000-32767
# - LoadBalancer: Зовнішній Load Balancer (потрібен cloud provider)
# - ExternalName: CNAME record для зовнішнього сервісу
#
# ============================================

apiVersion: v1
kind: Service

# ----------------------------------------
# METADATA
# ----------------------------------------
metadata:
  name: orchestra-backend
  namespace: default

  labels:
    app: orchestra
    component: backend
    service-type: api

  annotations:
    description: "Backend API Service"
    # Приклад annotation для cloud load balancer
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# ----------------------------------------
# SPEC
# ----------------------------------------
spec:
  # ========================================
  # TYPE - Тип сервісу
  # ========================================

  # ClusterIP - внутрішній доступ (за замовчуванням)
  type: ClusterIP

  # Для зовнішнього доступу можна використати:
  # type: NodePort
  # type: LoadBalancer

  # ========================================
  # SELECTOR - Які Pod'и обслуговувати
  # ========================================
  # Service знаходить Pod'и з цими labels
  # ВАЖЛИВО: Labels мають співпадати з Deployment!
  selector:
    app: orchestra
    component: backend

  # ========================================
  # PORTS - Налаштування портів
  # ========================================
  ports:
  - name: http              # Ім'я порту (для зручності)
    protocol: TCP           # Протокол (TCP або UDP)
    port: 80                # Порт Service (на який звертаються клієнти)
    targetPort: 8383        # Порт Pod'а (на який перенаправляється)

    # Для NodePort:
    # nodePort: 30080       # Порт на всіх нодах (30000-32767)

  # Можна додати більше портів:
  # - name: metrics
  #   protocol: TCP
  #   port: 9090
  #   targetPort: 9090

  # ========================================
  # SESSION AFFINITY
  # ========================================
  # За замовчуванням: None (random балансування)
  # ClientIP: той самий клієнт → той самий Pod
  sessionAffinity: None

  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800  # 3 години

  # ========================================
  # CLUSTER IP
  # ========================================
  # За замовчуванням: K8s призначає автоматично
  # Можна вказати конкретний IP:
  # clusterIP: 10.96.0.10

  # Для headless service (без load balancing):
  # clusterIP: None

  # ========================================
  # EXTERNAL IPs
  # ========================================
  # Для доступу через конкретні IP ноди
  # externalIPs:
  # - 192.168.1.100
  # - 192.168.1.101

# ============================================
# АЛЬТЕРНАТИВНІ КОНФІГУРАЦІЇ
# ============================================

---
# ----------------------------------------
# Приклад 1: NodePort Service
# (для dev/testing з зовнішнім доступом)
# ----------------------------------------
# apiVersion: v1
# kind: Service
# metadata:
#   name: orchestra-backend-nodeport
# spec:
#   type: NodePort
#   selector:
#     app: orchestra
#     component: backend
#   ports:
#   - protocol: TCP
#     port: 80
#     targetPort: 8383
#     nodePort: 30080  # Доступ через <NodeIP>:30080

---
# ----------------------------------------
# Приклад 2: LoadBalancer Service
# (для production з cloud provider)
# ----------------------------------------
# apiVersion: v1
# kind: Service
# metadata:
#   name: orchestra-backend-lb
#   annotations:
#     # AWS
#     service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
#     # GCP
#     cloud.google.com/load-balancer-type: "Internal"
# spec:
#   type: LoadBalancer
#   selector:
#     app: orchestra
#     component: backend
#   ports:
#   - protocol: TCP
#     port: 80
#     targetPort: 8383
#   # LoadBalancer дасть зовнішній IP

---
# ----------------------------------------
# Приклад 3: Headless Service
# (для direct Pod access, напр. для StatefulSet)
# ----------------------------------------
# apiVersion: v1
# kind: Service
# metadata:
#   name: orchestra-backend-headless
# spec:
#   clusterIP: None  # Headless!
#   selector:
#     app: orchestra
#     component: backend
#   ports:
#   - protocol: TCP
#     port: 8383
#     targetPort: 8383
#   # DNS повертає IP всіх Pod'ів замість одного IP

# ============================================
# ЯК ПРАЦЮЄ SERVICE
# ============================================
#
# 1. Service SELECTOR знаходить Pod'и:
#    kubectl get pods -l app=orchestra,component=backend
#
# 2. Service створює Endpoints:
#    kubectl get endpoints orchestra-backend
#
# 3. Коли щось звертається до Service:
#    http://orchestra-backend:80
#    ↓
#    Service балансує між Pod'ами:
#    → Pod 1 (10.244.1.10:8383)
#    → Pod 2 (10.244.1.11:8383)
#    → Pod 3 (10.244.1.12:8383)
#
# ============================================

# ============================================
# DNS ІМЕНА
# ============================================
#
# Service автоматично отримує DNS імена:
#
# 1. В тому ж namespace:
#    orchestra-backend
#    orchestra-backend:80
#
# 2. З іншого namespace:
#    orchestra-backend.default
#    orchestra-backend.default.svc
#    orchestra-backend.default.svc.cluster.local
#
# Повне DNS ім'я:
# <service-name>.<namespace>.svc.<cluster-domain>
#
# ============================================

# ============================================
# КОМАНДИ
# ============================================
#
# 1. Створити Service:
#    kubectl apply -f service.yaml
#
# 2. Переглянути Service:
#    kubectl get service orchestra-backend
#    kubectl get svc orchestra-backend  # скорочення
#    kubectl describe svc orchestra-backend
#
# 3. Переглянути Endpoints:
#    kubectl get endpoints orchestra-backend
#
# 4. Тест з іншого Pod'а:
#    kubectl run test --image=curlimages/curl -it --rm -- sh
#    curl http://orchestra-backend/congratulation
#
# 5. Port forwarding для локального тесту:
#    kubectl port-forward svc/orchestra-backend 8080:80
#    curl http://localhost:8080/congratulation
#
# 6. Видалити:
#    kubectl delete -f service.yaml
#
# ============================================

# ============================================
# TROUBLESHOOTING
# ============================================
#
# Service не працює?
#
# 1. Перевір чи є Pod'и:
#    kubectl get pods -l app=orchestra,component=backend
#
# 2. Перевір Endpoints:
#    kubectl get endpoints orchestra-backend
#    (має показати IP Pod'ів)
#
# 3. Перевір labels Pod'ів:
#    kubectl get pods --show-labels
#    (labels мають співпадати з selector Service)
#
# 4. Перевір порти:
#    Service port → Pod targetPort
#    kubectl describe svc orchestra-backend
#    kubectl describe pod <pod-name>
#
# 5. Тест з Pod'а:
#    kubectl run test --image=nicolaka/netshoot -it --rm -- bash
#    curl http://orchestra-backend/congratulation
#    nslookup orchestra-backend
#
# ============================================
