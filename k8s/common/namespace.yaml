# ============================================
# Namespace для Orchestra
# ============================================
#
# ЩО ТАКЕ NAMESPACE:
# - Віртуальна ізоляція ресурсів в кластері
# - Дозволяє розділити environments (dev/staging/prod)
# - Дозволяє налаштувати resource quotas
# - Дозволяє налаштувати RBAC (права доступу)
#
# ============================================

---
# Development Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: orchestra-dev
  labels:
    name: orchestra-dev
    environment: development

---
# Staging Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: orchestra-staging
  labels:
    name: orchestra-staging
    environment: staging

---
# Production Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: orchestra-prod
  labels:
    name: orchestra-prod
    environment: production

# ============================================
# ЯК ВИКОРИСТОВУВАТИ
# ============================================
#
# 1. Створити namespaces:
#    kubectl apply -f namespace.yaml
#
# 2. Переглянути namespaces:
#    kubectl get namespaces
#    kubectl get ns  # скорочення
#
# 3. Створити ресурси в namespace:
#    kubectl apply -f deployment.yaml -n orchestra-dev
#
# 4. Переглянути ресурси в namespace:
#    kubectl get all -n orchestra-dev
#
# 5. Встановити default namespace:
#    kubectl config set-context --current --namespace=orchestra-dev
#
# 6. Видалити namespace (ОБЕРЕЖНО - видалить ВСІ ресурси!):
#    kubectl delete namespace orchestra-dev
#
# ============================================

# ============================================
# RESOURCE QUOTAS (ліміти на namespace)
# ============================================

---
# Приклад Resource Quota для dev
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: orchestra-dev
spec:
  hard:
    # Максимум ресурсів
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi

    # Максимум об'єктів
    pods: "20"
    services: "10"
    configmaps: "10"
    persistentvolumeclaims: "5"

---
# Production quota (більше ресурсів)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: orchestra-prod
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "100"
    services: "50"

# ============================================
# LIMIT RANGES (default ліміти для Pod'ів)
# ============================================

---
# Default ліміти для Pod'ів в dev
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: orchestra-dev
spec:
  limits:
  # Для контейнерів
  - type: Container
    default:  # default limits
      cpu: 200m
      memory: 256Mi
    defaultRequest:  # default requests
      cpu: 100m
      memory: 128Mi
    max:  # максимум
      cpu: 500m
      memory: 512Mi
    min:  # мінімум
      cpu: 50m
      memory: 64Mi

  # Для Pod'ів
  - type: Pod
    max:
      cpu: 2
      memory: 2Gi

# ============================================
# NETWORK POLICIES (ізоляція мережі)
# ============================================

---
# Дозволити трафік тільки всередині namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: orchestra-dev
spec:
  podSelector: {}  # Всі Pod'и
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}  # З того ж namespace
  egress:
  - to:
    - podSelector: {}  # До того ж namespace

# ============================================
# КОМАНДИ
# ============================================
#
# Namespaces:
#   kubectl get ns
#   kubectl describe ns orchestra-dev
#   kubectl delete ns orchestra-dev
#
# Resource Quotas:
#   kubectl get quota -n orchestra-dev
#   kubectl describe quota dev-quota -n orchestra-dev
#
# Limit Ranges:
#   kubectl get limits -n orchestra-dev
#   kubectl describe limits dev-limits -n orchestra-dev
#
# Переключитись між namespaces:
#   kubectl config set-context --current --namespace=orchestra-dev
#   kubectl config view --minify | grep namespace:
#
# ============================================
