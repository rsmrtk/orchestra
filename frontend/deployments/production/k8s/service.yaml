apiVersion: v1
kind: Service
metadata:
  name: orchestra-frontend-production
  namespace: orchestra-space
  labels:
    app: orchestra-frontend
    environment: production
spec:
  type: NodePort
  selector:
    app: orchestra-frontend-production
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
    nodePort: 30000  # Frontend доступний на minikube-ip:30000
