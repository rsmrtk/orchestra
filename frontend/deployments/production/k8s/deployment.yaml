apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestra-frontend-production
  namespace: orchestra-space
  labels:
    app: orchestra-frontend
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestra-frontend-production
  template:
    metadata:
      labels:
        app: orchestra-frontend-production
        environment: production
    spec:
      containers:
      - name: frontend
        image: martun5/orchestra-frontend-production:v1.0.1
        imagePullPolicy: IfNotPresent  # Використовувати локальний image
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
