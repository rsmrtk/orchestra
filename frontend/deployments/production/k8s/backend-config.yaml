apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: orchestra-frontend-backend-config-production
  namespace: orchestra-space
spec:
  healthCheck:
    checkIntervalSec: 10
    port: 3000
    type: HTTP
    requestPath: /healthz
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
  cdn:
    enabled: true
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: false
    negativeCaching: true
