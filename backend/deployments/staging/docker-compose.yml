version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: ../production/Dockerfile
    container_name: orchestra-backend
    ports:
      - "8383:8383"
    environment:
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8383/congratulation"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - orchestra-network

  frontend:
    build:
      context: ../../../frontend
      dockerfile: ../../../frontend/Dockerfile
    container_name: orchestra-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orchestra-network

networks:
  orchestra-network:
    driver: bridge
