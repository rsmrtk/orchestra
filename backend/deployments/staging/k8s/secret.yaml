# =============================================================================
# SECRET - Секретні дані (паролі, токени, ключі)
# =============================================================================
# Що це?
# Secret схожий на ConfigMap, але для чутливих даних (паролів, API ключів).
# Дані зберігаються в base64 (це НЕ шифрування, просто кодування!).
#
# Навіщо?
# - Зберігати паролі, токени, API ключі окремо від коду
# - Kubernetes може шифрувати Secrets at rest (в etcd)
# - Обмежити доступ до секретів через RBAC
# - Не показувати секрети в логах при виконанні kubectl get/describe
#
# Як кодувати дані в base64?
# echo -n "my-password" | base64        # Виведе: bXktcGFzc3dvcmQ=
# echo "bXktcGFzc3dvcmQ=" | base64 -d   # Декодувати назад
#
# Як працює?
# 1. Створюєш Secret з закодованими даними
# 2. В Deployment монтуєш як env змінні або файли
# 3. Kubernetes автоматично декодує base64 при використанні
#
# ВАЖЛИВО:
# - НЕ комітити цей файл в Git з реальними секретами!
# - Використовуй GitOps інструменти (Sealed Secrets, External Secrets)
# - Або керуй секретами вручну через kubectl create secret
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: orchestra-backend-secret
  namespace: orchestra-staging
  labels:
    app: orchestra-backend
    environment: staging
type: Opaque                           # Opaque = довільні key-value дані
data:                                  # Дані в base64 кодуванні
  # ⚠️ КРИТИЧНО: НЕ КОМІТИТИ РЕАЛЬНІ СЕКРЕТИ В GIT!
  # ⚠️ Використовуйте kubectl create secret або Sealed Secrets!

  # Приклад як створити base64:
  # echo -n "your-api-key" | base64
  # echo -n "your-db-password" | base64
  # echo -n "your-jwt-secret" | base64

  # API ключ для зовнішнього сервісу
  # API_KEY: <your_base64_encoded_api_key>

  # Database password
  # DB_PASSWORD: <your_base64_encoded_password>

  # JWT секретний ключ
  # JWT_SECRET: <your_base64_encoded_jwt_secret>

# Альтернатива: створити Secret через kubectl (рекомендовано для продакшну!)
# kubectl create secret generic orchestra-backend-secret \
#   --from-literal=API_KEY=my-secret-api-key \
#   --from-literal=DB_PASSWORD=postgres-password-123 \
#   --namespace=orchestra-staging

# Як подивитися секрет:
# kubectl get secret orchestra-backend-secret -n orchestra-staging -o yaml
# Як декодувати значення:
# kubectl get secret orchestra-backend-secret -n orchestra-staging -o jsonpath='{.data.API_KEY}' | base64 -d
