# =============================================================================
# NAMESPACE - Простір імен в Kubernetes
# =============================================================================
# Що це?
# Namespace - це віртуальний кластер всередині твого фізичного кластера.
# Він дозволяє ізолювати ресурси різних проектів/середовищ (staging, production).
#
# Навіщо?
# - Ізоляція ресурсів (staging не перемішується з production)
# - Керування доступом (RBAC) - можна дати доступ тільки до staging
# - Квоти ресурсів - обмежити скільки CPU/RAM може використовувати staging
# - Організація - легше знайти ресурси конкретного проекту
#
# Як працює?
# Після створення namespace, всі інші ресурси створюються всередині нього.
# Команда: kubectl apply -f namespace.yaml
# =============================================================================

apiVersion: v1              # Версія API Kubernetes (v1 = стабільна core API)
kind: Namespace             # Тип ресурсу - Namespace
metadata:                   # Метадані - інформація про сам ресурс
  name: orchestra-staging   # Унікальне ім'я namespace (має бути DNS-сумісне)
  labels:                   # Мітки для організації та фільтрації
    name: orchestra-staging # Дублюємо ім'я в лейблах
    environment: staging    # Позначаємо що це staging середовище
    project: orchestra      # Позначаємо що це проект orchestra
    team: backend          # Для якої команди (можна додати свою команду)
