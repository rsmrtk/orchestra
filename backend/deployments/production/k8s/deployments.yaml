apiVersion: apps/v1
kind: Deployment
metadata:
  name: orhestra-backend-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orchestra-backend-production
  template:
    metadata:
      labels:
        app: orchestra-backend-production
    spec:
      containers:
        - name: orchestra-backend-production
          image: martun5/orchestra-backend-production:v1.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8282
