apiVersion: v1
kind: Service
metadata:
  name: orchestra-backend-service-production
  namespace: orchestra-space
  labels:
    app: orchestra-backend-production
    environment: production
spec:
  type: NodePort
  selector:
    app: orchestra-backend-production
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8282
    nodePort: 30080  # Backend доступний на minikube-ip:30080
