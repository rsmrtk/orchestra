# =============================================================================
# NAMESPACE - Віртуальний кластер для ізоляції ресурсів
# =============================================================================
# Це як окрема "кімната" в твоєму Kubernetes кластері.
# Всі ресурси (Pod'и, Service'и, Secret'и) будуть створені всередині цього namespace.
#
# Чому це важливо?
# - Ізоляція: production не перемішується з staging
# - Безпека: можна обмежити доступ (RBAC) тільки до production
# - Квоти: можна обмежити скільки CPU/RAM може використовувати production
# - Організація: легко знайти всі ресурси проекту
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: orchestra-space
  labels:
    name: orchestra-space
    environment: production        # Позначаємо що це production
    project: orchestra
    managed-by: kubectl           # Можна змінити на argocd, helm, etc
