# =============================================================================
# SECRET - Секретні дані (паролі, токени, API ключі)
# =============================================================================
# ⚠️ УВАГА! НЕ КОМІТИТИ ЦЕЙ ФАЙЛ В GIT З РЕАЛЬНИМИ ПАРОЛЯМИ!
#
# Secret зберігає чутливі дані в base64 кодуванні.
# Base64 - це НЕ шифрування, це просто кодування!
# Будь-хто хто має доступ до кластера може декодувати ці значення.
#
# Як кодувати значення в base64:
# echo -n "my-password" | base64           # Кодувати
# echo "bXktcGFzc3dvcmQ=" | base64 -d      # Декодувати назад
#
# BEST PRACTICE для production:
# 1. НЕ зберігай цей файл в Git
# 2. Створюй Secret вручну: kubectl create secret generic ...
# 3. Або використовуй GitOps інструменти:
#    - Sealed Secrets (bitnami-labs)
#    - External Secrets Operator
#    - Vault by HashiCorp
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: orchestra-backend-secret
  namespace: orchestra-space
  labels:
    app: orchestra-backend
    environment: production
type: Opaque                          # Opaque = загальний тип для довільних key-value даних

# ---------------------------------------------------------------------------
# DATA - Секретні дані в base64 кодуванні
# ---------------------------------------------------------------------------
data:
  # Database credentials
  # ВАЖЛИВО: Зміни ці значення на свої реальні паролі!

  # DB_HOST: orchestra-db (в base64)
  DB_HOST: b3JjaGVzdHJhLWRi

  # DB_PORT: 2828 (в base64)
  DB_PORT: MjgyOA==

  # DB_USER: rsmrtk (в base64)
  # Зміни на свій username!
  DB_USER: cnNtcnRr

  # DB_PASSWORD: rsmrtk (в base64)
  # ⚠️ КРИТИЧНО: Зміни на сильний пароль для production!
  # Приклад: echo -n "SuperSecurePassword123!" | base64
  DB_PASSWORD: cnNtcnRr

  # DB_NAME: orchestra-db (в base64)
  DB_NAME: b3JjaGVzdHJhLWRi

# ---------------------------------------------------------------------------
# stringData (опціонально) - автоматично конвертується в base64
# ---------------------------------------------------------------------------
# Якщо не хочеш вручну кодувати в base64, можеш використати stringData:
# stringData:
#   DB_PASSWORD: "my-plain-password"
# Kubernetes автоматично закодує це в base64

---
# =============================================================================
# ЯК СТВОРИТИ SECRET БЕЗПЕЧНО (рекомендовано для production)
# =============================================================================
#
# Метод 1: Через kubectl (найбезпечніший)
# ----------------------------------------
# kubectl create secret generic orchestra-backend-secret \
#   --from-literal=DB_HOST=orchestra-db \
#   --from-literal=DB_PORT=2828 \
#   --from-literal=DB_USER=rsmrtk \
#   --from-literal=DB_PASSWORD=YourStrongPassword123! \
#   --from-literal=DB_NAME=orchestra-db \
#   --namespace=orchestra-space
#
# Метод 2: З файлу (для більших даних, наприклад SSL certificates)
# ------------------------------------------------------------------
# kubectl create secret generic tls-secret \
#   --from-file=tls.crt=/path/to/cert.crt \
#   --from-file=tls.key=/path/to/cert.key \
#   --namespace=orchestra-space
#
# Метод 3: Sealed Secrets (для GitOps)
# ------------------------------------
# 1. Встанови Sealed Secrets controller
# 2. Створи Secret локально
# 3. Seal (зашифруй) Secret:
#    kubeseal -f secret.yaml -w sealed-secret.yaml
# 4. Тепер sealed-secret.yaml можна комітити в Git
# 5. Controller автоматично розшифрує його в кластері
#
# =============================================================================
# ЯК ВИКОРИСТОВУВАТИ SECRET В DEPLOYMENT
# =============================================================================
#
# В Deployment файлі:
# env:
#   - name: DB_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: orchestra-backend-secret    # Ім'я Secret
#         key: DB_PASSWORD                  # Ключ з data секції
#
# Kubernetes автоматично:
# 1. Декодує base64 значення
# 2. Встановить як змінну середовища DB_PASSWORD в контейнері
# 3. Твій додаток побачить: DB_PASSWORD="rsmrtk"
#
# =============================================================================
# МОНІТОРИНГ ТА DEBUGGING
# =============================================================================
#
# Подивитися всі secrets:
# kubectl get secrets -n orchestra-space
#
# Подивитися деталі secret:
# kubectl describe secret orchestra-backend-secret -n orchestra-space
# (не покаже значення, тільки ключі)
#
# Подивитися закодоване значення:
# kubectl get secret orchestra-backend-secret -n orchestra-space -o yaml
#
# Декодувати конкретне значення:
# kubectl get secret orchestra-backend-secret -n orchestra-space \
#   -o jsonpath='{.data.DB_PASSWORD}' | base64 -d
#
# Видалити secret:
# kubectl delete secret orchestra-backend-secret -n orchestra-space
#
# =============================================================================
