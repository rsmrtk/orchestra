# =============================================================================
# BACKEND DEPLOYMENT - Orchestra Backend Application (PRODUCTION)
# =============================================================================
# Це ВИПРАВЛЕНА версія твого deployments.yaml з покращеннями:
# 1. ✅ Використовує ConfigMap для конфігурації
# 2. ✅ Краща організація env змінних
# 3. ✅ Додані startup probe для швидшого старту
# 4. ✅ Production-ready налаштування
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestra-backend-production
  namespace: orchestra-space
  labels:
    app: orchestra-backend
    component: api
    environment: production
spec:
  # ---------------------------------------------------------------------------
  # REPLICAS - кількість Pod'ів
  # ---------------------------------------------------------------------------
  replicas: 3                  # 3 репліки для high availability
                               # HPA може автоматично змінювати це значення

  # ---------------------------------------------------------------------------
  # SELECTOR - як знайти Pod'и
  # ---------------------------------------------------------------------------
  selector:
    matchLabels:
      app: orchestra-backend-production

  # ---------------------------------------------------------------------------
  # STRATEGY - як оновлювати Pod'и
  # ---------------------------------------------------------------------------
  strategy:
    type: RollingUpdate        # Оновлювати поступово (без downtime)
    rollingUpdate:
      maxUnavailable: 1        # Максимум 1 Pod може бути недоступним
                               # З 3 реплік: мінімум 2 завжди працюють
      maxSurge: 1              # Максимум +1 додатковий Pod під час update
                               # З 3 реплік: максимум 4 під час update

  # Як працює RollingUpdate з 3 репліками:
  # 1. Старт: 3 Pod'и (v1.0.8)
  # 2. Створюється 1 новий Pod (v1.0.9) -> 4 Pod'и
  # 3. Чекаємо поки новий Pod стане Ready
  # 4. Видаляємо 1 старий Pod -> 3 Pod'и (2 старих + 1 новий)
  # 5. Повторюємо поки всі не оновляться
  # Результат: Завжди мінімум 2 Pod'и доступні (zero downtime!)

  # ---------------------------------------------------------------------------
  # POD TEMPLATE
  # ---------------------------------------------------------------------------
  template:
    metadata:
      labels:
        app: orchestra-backend-production
        environment: production
      annotations:
        # Prometheus metrics scraping (якщо використовуєш)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # -------------------------------------------------------------------------
      # CONTAINERS
      # -------------------------------------------------------------------------
      containers:
      - name: orchestra-backend-production
        image: martun5/orchestra-backend-production:v1.0.8
        imagePullPolicy: IfNotPresent

        # -----------------------------------------------------------------------
        # PORTS
        # -----------------------------------------------------------------------
        ports:
        - containerPort: 8282
          name: http
          protocol: TCP
        - containerPort: 9090     # Metrics port (опціонально)
          name: metrics
          protocol: TCP

        # -----------------------------------------------------------------------
        # ENVIRONMENT VARIABLES
        # -----------------------------------------------------------------------
        env:
        # Gin mode (з ConfigMap)
        - name: GIN_MODE
          valueFrom:
            configMapKeyRef:
              name: orchestra-backend-config
              key: GIN_MODE

        # App port (з ConfigMap)
        - name: APP_PORT
          valueFrom:
            configMapKeyRef:
              name: orchestra-backend-config
              key: APP_PORT

        # Log level (з ConfigMap)
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: orchestra-backend-config
              key: LOG_LEVEL

        # Database connection (з Secret)
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: orchestra-backend-secret
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: orchestra-backend-secret
              key: DB_PORT

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: orchestra-backend-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orchestra-backend-secret
              key: DB_PASSWORD

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: orchestra-backend-secret
              key: DB_NAME

        # Також можна завантажити всі змінні з ConfigMap одразу:
        # envFrom:
        #   - configMapRef:
        #       name: orchestra-backend-config
        #   - secretRef:
        #       name: orchestra-backend-secret

        # -----------------------------------------------------------------------
        # STARTUP PROBE - чи додаток стартував?
        # -----------------------------------------------------------------------
        # Startup probe виконується ТІЛЬКИ під час старту Pod'а
        # Корисно для додатків які довго стартують
        # Після успішного startup - запускаються liveness/readiness probes
        startupProbe:
          httpGet:
            path: /congratulation
            port: 8282
          initialDelaySeconds: 10  # Чекати 10 сек після старту
          periodSeconds: 5         # Перевіряти кожні 5 сек
          timeoutSeconds: 58
          failureThreshold: 12     # 12 спроб * 5 сек = 60 сек максимум на старт
                                   # Якщо за 60 сек не стартував -> Pod killed

        # -----------------------------------------------------------------------
        # LIVENESS PROBE - чи живий додаток?
        # -----------------------------------------------------------------------
        # Якщо liveness fails -> Kubernetes перезапускає контейнер
        # Використовуй для виявлення deadlock, infinite loop, etc.
        livenessProbe:
          httpGet:
            path: /congratulation
            port: 8282
          initialDelaySeconds: 30  # Чекати 30 сек після startup probe
          periodSeconds: 10        # Перевіряти кожні 10 сек
          timeoutSeconds: 5
          failureThreshold: 3      # 3 невдалі спроби = restart

        # -----------------------------------------------------------------------
        # READINESS PROBE - чи готовий приймати трафік?
        # -----------------------------------------------------------------------
        # Якщо readiness fails -> Pod виключається з Service endpoints
        # Service не буде слати трафік на цей Pod
        readinessProbe:
          httpGet:
            path: /congratulation
            port: 8282
          initialDelaySeconds: 10  # Швидше ніж liveness
          periodSeconds: 5         # Частіше перевіряти
          timeoutSeconds: 3
          failureThreshold: 3

        # Різниця між probes:
        # - startup: Чи додаток стартував? (одноразово)
        # - liveness: Чи додаток живий? (постійно) -> restart якщо ні
        # - readiness: Чи додаток готовий? (постійно) -> exclude з Service якщо ні

        # -----------------------------------------------------------------------
        # RESOURCES - CPU та Memory
        # -----------------------------------------------------------------------
        resources:
          requests:
            memory: "256Mi"      # Гарантовано 256Mi RAM
            cpu: "250m"          # Гарантовано 0.25 CPU cores
          limits:
            memory: "512Mi"      # Максимум 512Mi RAM (OOMKilled якщо більше)
            cpu: "500m"          # Максимум 0.5 CPU cores (throttled якщо більше)

        # Рекомендації для Go backend:
        # Small (< 100 RPS): 128-256Mi RAM, 100-250m CPU
        # Medium (100-1000 RPS): 256-512Mi RAM, 250-500m CPU
        # Large (1000-10000 RPS): 512Mi-1Gi RAM, 500m-1 CPU
        # Very large (10000+ RPS): 1-2Gi RAM, 1-2 CPU + horizontal scaling

        # ⚠️ ВАЖЛИВО: requests має бути < limits
        # requests: Гарантований мінімум (для HPA calculations)
        # limits: Максимум (захист від resource exhaustion)

        # -----------------------------------------------------------------------
        # SECURITY CONTEXT (опціонально, але рекомендовано)
        # -----------------------------------------------------------------------
        securityContext:
          runAsNonRoot: true     # Не дозволяти запуск від root
          runAsUser: 1000        # UID для запуску (non-root user)
          allowPrivilegeEscalation: false  # Не дозволяти підвищення привілеїв
          readOnlyRootFilesystem: false    # true якщо не потрібен запис в /
          capabilities:
            drop:
            - ALL                # Видалити всі Linux capabilities

---
# =============================================================================
# ЯК ЦЕ ПРАЦЮЄ (ДЕТАЛЬНИЙ LIFECYCLE)
# =============================================================================
#
# 1. kubectl apply -f backend-deployment.yaml
#    └─> API Server валідує YAML і зберігає в etcd
#
# 2. Deployment Controller бачить новий Deployment:
#    └─> Створює ReplicaSet з template і replicas: 3
#
# 3. ReplicaSet Controller бачить ReplicaSet:
#    └─> Створює 3 Pod'и
#
# 4. Scheduler для кожного Pod'а:
#    ├─> Шукає Node де достатньо ресурсів (256Mi RAM, 0.25 CPU)
#    ├─> Перевіряє nodeSelector, affinity, taints/tolerations
#    └─> Призначає Pod на Node
#
# 5. Kubelet на Node:
#    ├─> Pull image: martun5/orchestra-backend-production:v1.0.8
#    ├─> Створює контейнер
#    └─> Запускає додаток
#
# 6. Startup Probe (10 sec delay):
#    └─> Kubernetes чекає 10 sec, потім кожні 5 sec перевіряє /congratulation
#        ├─> Успіх: Pod переходить до liveness/readiness probes
#        └─> 12 failures (60 sec): Pod killed і restart
#
# 7. Readiness Probe (10 sec delay):
#    └─> Kubernetes перевіряє кожні 5 sec
#        ├─> Успіх: Pod додається в Service endpoints (приймає трафік)
#        └─> Failure: Pod виключається з Service (не приймає трафік)
#
# 8. Liveness Probe (30 sec delay):
#    └─> Kubernetes перевіряє кожні 10 sec
#        ├─> Успіх: Pod продовжує працювати
#        └─> 3 failures: Container killed і restart
#
# 9. Service:
#    └─> Коли Pod Ready -> його IP додається в Service endpoints
#        Frontend тепер може робити запити до backend
#
# =============================================================================
# ROLLING UPDATE PROCESS
# =============================================================================
#
# Сценарій: Оновлення з v1.0.8 до v1.0.9
#
# 1. kubectl set image deployment/orchestra-backend-production \
#    orchestra-backend-production=martun5/orchestra-backend-production:v1.0.9
#
# 2. Deployment створює новий ReplicaSet (v1.0.9)
#
# 3. Старт: 3 Pod'и v1.0.8 (Ready)
#
# 4. Крок 1: Створюється 1 Pod v1.0.9 (maxSurge: 1)
#    └─> Тепер: 3 old + 1 new = 4 Pod'и
#    └─> Чекаємо поки Pod v1.0.9 стане Ready (startup + readiness)
#
# 5. Крок 2: Коли Pod v1.0.9 Ready -> видаляється 1 Pod v1.0.8
#    └─> Тепер: 2 old + 1 new = 3 Pod'и
#
# 6. Крок 3: Створюється 2-й Pod v1.0.9
#    └─> Тепер: 2 old + 2 new = 4 Pod'и
#    └─> Чекаємо Ready
#
# 7. Крок 4: Видаляється 2-й Pod v1.0.8
#    └─> Тепер: 1 old + 2 new = 3 Pod'и
#
# 8. Крок 5: Створюється 3-й Pod v1.0.9
#    └─> Тепер: 1 old + 3 new = 4 Pod'и
#    └─> Чекаємо Ready
#
# 9. Крок 6: Видаляється останній Pod v1.0.8
#    └─> Фініш: 0 old + 3 new = 3 Pod'и v1.0.9
#
# Результат: Zero downtime! Завжди мінімум 2 Pod'и Ready
#
# =============================================================================
# МОНІТОРИНГ
# =============================================================================
#
# Перевірити Deployment:
# kubectl get deployment orchestra-backend-production -n orchestra-space
#
# Перевірити ReplicaSets:
# kubectl get replicaset -n orchestra-space -l app=orchestra-backend-production
#
# Перевірити Pod'и:
# kubectl get pods -n orchestra-space -l app=orchestra-backend-production
#
# Подивитися Rolling Update в реальному часі:
# kubectl rollout status deployment/orchestra-backend-production -n orchestra-space
#
# Подивитися історію оновлень:
# kubectl rollout history deployment/orchestra-backend-production -n orchestra-space
#
# Rollback до попередньої версії:
# kubectl rollout undo deployment/orchestra-backend-production -n orchestra-space
#
# Rollback до конкретної ревізії:
# kubectl rollout undo deployment/orchestra-backend-production --to-revision=2 -n orchestra-space
#
# Паузувати Rolling Update:
# kubectl rollout pause deployment/orchestra-backend-production -n orchestra-space
#
# Продовжити Rolling Update:
# kubectl rollout resume deployment/orchestra-backend-production -n orchestra-space
#
# Логи з усіх Pod'ів:
# kubectl logs -n orchestra-space -l app=orchestra-backend-production -f
#
# Ресурси:
# kubectl top pods -n orchestra-space -l app=orchestra-backend-production
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# Проблема: Pod'и не стартують
# kubectl describe pod <pod-name> -n orchestra-space
# - ImagePullBackOff: неправильний image або немає доступу до registry
# - CrashLoopBackOff: додаток падає (дивись логи)
# - Pending: недостатньо ресурсів на Node
#
# Проблема: Pod стартував але не Ready
# - Readiness probe fails (дивись логи)
# - Startup probe timeout (збільш failureThreshold)
# - Додаток не слухає на правильному порту
#
# Проблема: Rolling Update не завершується
# - Новий Pod не стає Ready (readiness probe fails)
# - Недостатньо ресурсів для створення нових Pod'ів
# - PDB блокує видалення старих Pod'ів
#
# Проблема: OOMKilled (Out Of Memory)
# - Збільш resources.limits.memory
# - Перевір memory leaks в додатку
# - Додай metrics для моніторингу
#
# Проблема: CPU Throttling
# - Збільш resources.limits.cpu
# - Оптимізуй код (profiling)
# - Масштабуй горизонтально (більше реплік)
#
# =============================================================================
