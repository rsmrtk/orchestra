# =============================================================================
# NETWORK POLICY - Мережева безпека (firewall для Pod'ів)
# =============================================================================
# NetworkPolicy контролює який трафік може входити (ingress) та
# виходити (egress) з Pod'ів. Це як firewall rules в Kubernetes.
#
# Навіщо це потрібно?
# ✅ Безпека: Ізолювати Pod'и один від одного
# ✅ Least privilege: Дозволити тільки необхідні з'єднання
# ✅ Захист: Якщо хакер зламає frontend - не зможе підключитися до БД
# ✅ Compliance: PCI DSS, HIPAA, SOC2 вимагають network segmentation
#
# Як працює?
# 1. По замовчуванню: Всі Pod'и можуть спілкуватися з усіма (allow all)
# 2. Коли створюєш NetworkPolicy: Стає whitelist (дозволено тільки вказане)
# 3. CNI plugin читає NetworkPolicy і налаштовує iptables на Node'ах
# 4. Kernel блокує недозволений трафік
#
# Вимоги:
# - CNI plugin має підтримувати NetworkPolicy (Calico, Cilium, Weave, Canal)
# - Flannel НЕ підтримує NetworkPolicy!
# =============================================================================

---
# =============================================================================
# POLICY #1: Backend Ingress - хто може з'єднуватися ДО backend
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress-policy
  namespace: orchestra-space
  labels:
    app: orchestra-backend
    environment: production
spec:
  # ---------------------------------------------------------------------------
  # POD SELECTOR - до яких Pod'ів застосовується ця політика
  # ---------------------------------------------------------------------------
  podSelector:
    matchLabels:
      app: orchestra-backend-production  # Тільки до backend Pod'ів

  # ---------------------------------------------------------------------------
  # POLICY TYPES - які типи трафіку контролювати
  # ---------------------------------------------------------------------------
  policyTypes:
  - Ingress                    # Контролювати вхідний трафік

  # ---------------------------------------------------------------------------
  # INGRESS RULES - хто може з'єднуватися ДО backend
  # ---------------------------------------------------------------------------
  ingress:
  # Rule #1: Дозволити трафік з Ingress Controller
  - from:
    - namespaceSelector:       # З namespace ingress-nginx
        matchLabels:
          name: ingress-nginx
      podSelector:             # І тільки з Pod'ів ingress-controller
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8282               # Backend слухає на 8282

  # Rule #2: Дозволити трафік з Frontend Pod'ів (в тому самому namespace)
  - from:
    - podSelector:             # З Pod'ів з label app=orchestra-frontend
        matchLabels:
          app: orchestra-frontend-production
    ports:
    - protocol: TCP
      port: 8282

  # Rule #3: Дозволити health checks з будь-якого Pod'а в кластері
  # (Kubernetes control plane, Prometheus, etc.)
  - from:
    - namespaceSelector: {}    # {} = всі namespaces
    ports:
    - protocol: TCP
      port: 8282

---
# =============================================================================
# POLICY #2: Backend Egress - куди backend може з'єднуватися
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress-policy
  namespace: orchestra-space
  labels:
    app: orchestra-backend
    environment: production
spec:
  podSelector:
    matchLabels:
      app: orchestra-backend-production

  policyTypes:
  - Egress                     # Контролювати вихідний трафік

  # ---------------------------------------------------------------------------
  # EGRESS RULES - куди backend може з'єднуватися
  # ---------------------------------------------------------------------------
  egress:
  # Rule #1: Дозволити DNS (критично важливо!)
  # Без DNS backend не зможе резолвити імена (orchestra-db, external APIs)
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system    # CoreDNS в kube-system namespace
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53                 # DNS port

  # Rule #2: Дозволити з'єднання до PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
          component: database
    ports:
    - protocol: TCP
      port: 5432               # PostgreSQL container port (внутрішній)

  # Rule #3: Дозволити HTTPS до зовнішніх API (опціонально)
  # Якщо backend потребує викликати зовнішні сервіси
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0        # Весь інтернет
        except:                # Окрім приватних мереж
        - 10.0.0.0/8           # Private network
        - 172.16.0.0/12        # Private network
        - 192.168.0.0/16       # Private network
    ports:
    - protocol: TCP
      port: 443                # HTTPS
    - protocol: TCP
      port: 80                 # HTTP (якщо потрібно)

  # Rule #4: Дозволити Kubernetes API (якщо backend потребує)
  # - to:
  #   - namespaceSelector:
  #       matchLabels:
  #         name: default
  #   ports:
  #   - protocol: TCP
  #     port: 443

---
# =============================================================================
# POLICY #3: PostgreSQL Ingress - тільки backend може підключитися до БД
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-policy
  namespace: orchestra-space
  labels:
    app: postgres
    environment: production
spec:
  podSelector:
    matchLabels:
      app: postgres
      component: database

  policyTypes:
  - Ingress

  ingress:
  # Тільки backend може з'єднуватися до PostgreSQL
  - from:
    - podSelector:
        matchLabels:
          app: orchestra-backend-production
    ports:
    - protocol: TCP
      port: 5432

---
# =============================================================================
# POLICY #4: PostgreSQL Egress - БД може тільки DNS
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-egress-policy
  namespace: orchestra-space
  labels:
    app: postgres
    environment: production
spec:
  podSelector:
    matchLabels:
      app: postgres
      component: database

  policyTypes:
  - Egress

  egress:
  # PostgreSQL потребує тільки DNS (для resolve hostnames)
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53

---
# =============================================================================
# ЯК ЦЕ ПРАЦЮЄ (ДЕТАЛЬНІ СЦЕНАРІЇ)
# =============================================================================
#
# Сценарій 1: Frontend -> Backend (✅ ДОЗВОЛЕНО)
# ----------------------------------------------
# 1. Frontend Pod робить request: http://orchestra-backend-service:80
# 2. Packet приходить на backend Pod IP:8282
# 3. Kernel перевіряє NetworkPolicy backend-ingress-policy:
#    ├─> Source: frontend Pod (app=orchestra-frontend-production) ✅
#    ├─> Destination Port: 8282 ✅
#    └─> ALLOW
# 4. Backend отримує request
#
# Сценарій 2: Backend -> PostgreSQL (✅ ДОЗВОЛЕНО)
# ------------------------------------------------
# 1. Backend робить SQL query: orchestra-db:2828
# 2. DNS resolve через CoreDNS ✅ (egress rule #1)
# 3. Packet йде на postgres Pod IP:5432
# 4. Kernel перевіряє NetworkPolicy postgres-ingress-policy:
#    ├─> Source: backend Pod (app=orchestra-backend-production) ✅
#    ├─> Destination Port: 5432 ✅
#    └─> ALLOW
# 5. PostgreSQL отримує query
#
# Сценарій 3: Frontend -> PostgreSQL (❌ БЛОКОВАНО)
# -------------------------------------------------
# 1. Frontend (зламаний хакером) намагається: postgres:5432
# 2. DNS resolve ✅ (frontend має egress DNS rule)
# 3. Packet йде на postgres Pod IP:5432
# 4. Kernel перевіряє NetworkPolicy postgres-ingress-policy:
#    ├─> Source: frontend Pod (app=orchestra-frontend-production) ❌
#    ├─> НЕ співпадає з дозволеними (тільки backend)
#    └─> DROP
# 5. Connection refused
# 6. 🛡️ БД захищена!
#
# Сценарій 4: Зовнішній зловмисник -> Backend (❌ БЛОКОВАНО)
# ----------------------------------------------------------
# 1. Хакер намагається прямий доступ: backend-pod-ip:8282
# 2. Packet приходить на backend Pod
# 3. NetworkPolicy backend-ingress-policy перевіряє:
#    ├─> Source: Зовнішній IP ❌
#    ├─> НЕ з дозволених (ingress-nginx, frontend, kube-system)
#    └─> DROP
# 4. 🛡️ Backend захищений!
#
# Сценарій 5: Backend -> External API (✅ ДОЗВОЛЕНО)
# --------------------------------------------------
# 1. Backend робить HTTP request: https://api.example.com
# 2. DNS resolve ✅ (egress rule #1)
# 3. Packet йде на 1.2.3.4:443 (external IP)
# 4. NetworkPolicy backend-egress-policy перевіряє:
#    ├─> Destination: 1.2.3.4 (не в except list) ✅
#    ├─> Port: 443 ✅
#    └─> ALLOW
# 5. Request відправляється
#
# =============================================================================
# МОНІТОРИНГ
# =============================================================================
#
# Перевірити NetworkPolicy:
# kubectl get networkpolicy -n orchestra-space
#
# Подивитися деталі:
# kubectl describe networkpolicy backend-ingress-policy -n orchestra-space
#
# Тестувати з'єднання (має бути дозволено):
# kubectl run -it --rm test-frontend --image=curlimages/curl \
#   --labels="app=orchestra-frontend-production" -n orchestra-space -- \
#   curl http://orchestra-backend-service-production/congratulation
#
# Тестувати з'єднання (має бути блоковано):
# kubectl run -it --rm test-attacker --image=curlimages/curl \
#   -n orchestra-space -- \
#   curl --max-time 5 http://orchestra-backend-service-production/congratulation
# (timeout через 5 сек - заблоковано!)
#
# Для Calico - подивитися blocked connections:
# calicoctl get globalnetworkpolicy -o yaml
#
# Для Cilium - моніторинг:
# cilium monitor --type drop
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# Проблема: NetworkPolicy не працює
# - CNI plugin не підтримує (наприклад Flannel)
# - Встанови Calico або Cilium
#
# Проблема: Backend не може підключитися до БД
# kubectl exec -n orchestra-space <backend-pod> -- curl postgres:5432
# Connection timeout
#
# Причини:
# 1. Перевір selector в NetworkPolicy vs labels Pod'ів
#    kubectl get pods --show-labels -n orchestra-space
# 2. Перевір namespace labels
#    kubectl get namespace orchestra-space --show-labels
# 3. Перевір ports (5432 в policy vs reality)
# 4. Дивись NetworkPolicy describe
#
# Проблема: DNS не працює
# kubectl exec -n orchestra-space <pod> -- nslookup google.com
# Connection timeout
#
# Рішення: Додати egress rule для DNS (port 53 UDP до kube-system:kube-dns)
#
# Проблема: Не можу підключитися до backend після apply NetworkPolicy
# - Перевір чи додано правило для джерела трафіку
# - Подивись logs Ingress Controller
# - Тимчасово видали NetworkPolicy для testing:
#   kubectl delete networkpolicy backend-ingress-policy -n orchestra-space
#
# =============================================================================
# BEST PRACTICES
# =============================================================================
#
# 1. ✅ Start з default-deny-all, потім додавай whitelist rules
# 2. ✅ ЗАВЖДИ дозволяй DNS (port 53 UDP)
# 3. ✅ Використовуй principle of least privilege
# 4. ✅ Окремі policies для ingress та egress
# 5. ✅ Тестуй на staging перед production
# 6. ✅ Документуй чому потрібне кожне правило
# 7. ✅ Моніторинг dropped connections
# 8. ✅ БД має приймати тільки від backend (ніколи від frontend!)
#
# =============================================================================
