services:
  backend:
    build:
      context: ../..
      dockerfile: deployments/production/Dockerfile
    container_name: orchestra-backend-production
    ports:
      - "8383:8282"
    environment:
      - GIN_MODE=release
      - DB_HOST=172.17.0.2
      - DB_PORT=5432
      - DB_USER=rsmrtk
      - DB_PASSWORD=rsmrtkrsmrtk
      - DB_NAME=orchestra
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8282/congratulation"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - orchestra-network

  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
    container_name: orchestra-frontend-production
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orchestra-network

networks:
  orchestra-network:
    driver: bridge
