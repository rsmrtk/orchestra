services:
  postgres:
    image: postgres:17
    container_name: orchestra-db
    environment:
      POSTGRES_DB: ${DB_NAME:-orchestra-db}
      # ВАЖЛИВО: Встановіть ці змінні у .env файлі!
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-2828}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../pkg/dbmodel/db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-orchestra-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - orchestra-network

  backend:
    build:
      context: ../..
      dockerfile: deployments/production/Dockerfile
    container_name: orchestra-backend-production
    ports:
      - "${BACKEND_PORT:-8383}:8282"
    environment:
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: postgres
      DB_PORT: 5432
      # ВАЖЛИВО: Встановіть ці змінні у .env файлі!
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-orchestra-db}
      PORT: 8282
      # ВАЖЛИВО: Згенеруйте власний JWT_SECRET для продакшену!
      JWT_SECRET: ${JWT_SECRET}
      JWT_DURATION: ${JWT_DURATION:-24h}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8282/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - orchestra-network

  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8383}
    container_name: orchestra-frontend-production
    ports:
      - "${FRONTEND_PORT:-5252}:5252"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orchestra-network

networks:
  orchestra-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
